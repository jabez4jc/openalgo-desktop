name: Install gitleaks
description: >
  Installs a pinned gitleaks release on a Linux x64 runner and verifies its
  SHA-256 before use. The binary is used directly instead of
  gitleaks/gitleaks-action, which needs a paid license for organisation repos.

inputs:
  version:
    description: gitleaks version without the leading v
    required: false
    default: "8.30.1"
  sha256:
    description: SHA-256 of gitleaks_<version>_linux_x64.tar.gz (update together with version)
    required: false
    default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

runs:
  using: composite
  steps:
    - name: Download and verify gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
        GITLEAKS_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        dest="${RUNNER_TEMP}/gitleaks"
        mkdir -p "${dest}"
        curl -sSfL --retry 3 -o "${dest}/${archive}" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  ${dest}/${archive}" | sha256sum --check --strict
        tar -xzf "${dest}/${archive}" -C "${dest}" gitleaks
        echo "${dest}" >> "${GITHUB_PATH}"
        "${dest}/gitleaks" version
